<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="語彙ドリル">
<title>準1級 語彙ドリル</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1d2330;--muted:#6b7280;--line:#e3e6eb;--acc:#2563eb;--ok:#16a34a;--ng:#dc2626;--okbg:#e8f7ee;--ngbg:#fdecec}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2128;--fg:#e6e8ec;--muted:#9aa3b2;--line:#2e333c;--acc:#60a5fa;--ok:#4ade80;--ng:#f87171;--okbg:#173322;--ngbg:#3a1d1d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Segoe UI","Yu Gothic UI","Hiragino Sans",sans-serif;font-size:16px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
h1{font-size:18px;margin:0}
h2{font-size:16px;margin:0 0 10px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:none;background:none;padding:6px 10px;border-radius:6px}
nav button.active{background:var(--acc);color:#fff}
main{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.hidden{display:none!important}
.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
button.danger{color:var(--ng)}
input,select{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
input[type=number]{width:70px}
.quota{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:14px;background:var(--line);border-radius:7px;overflow:hidden}
#quotaFill{height:100%;background:var(--ok);width:0;transition:width .3s}
.quizhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.minibox{display:flex;align-items:center;gap:6px;margin-left:auto}
#miniChart svg{width:120px;height:24px;display:block}
.qtext{font-size:20px;line-height:1.7;margin-bottom:12px}
.qtext .line{display:flex;gap:8px}
.qtext .spk{font-weight:700;min-width:1.6em}
.qtext .w{cursor:pointer;border-radius:3px}
.answered .qtext .w:hover{background:#fde68a;color:#000}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--fg);text-align:center;margin:0 2px}
.blank.filled{color:var(--ok);font-weight:700}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.choices{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:560px){.choices{grid-template-columns:1fr}}
.choices li{border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;font-size:18px;user-select:none;display:flex;gap:10px;align-items:center}
.choices li:hover{border-color:var(--acc)}
.choices li .n{font-weight:700;color:var(--muted)}
.choices li .t{flex:1}
.choices li .x{border:none;background:none;color:var(--muted);font-size:16px;padding:6px 10px;margin:-6px -6px -6px 0}
.answered .choices li .x{visibility:hidden}
.choices li.elim .x{color:var(--ng)}
.choices li.elim .t{text-decoration:line-through;opacity:.4}
.choices li.correct{background:var(--okbg);border-color:var(--ok)}
.choices li.wrongpick{background:var(--ngbg);border-color:var(--ng)}
.elimmode .choices li{border-style:dashed}
#elimHint{color:var(--ng);margin-top:6px}
#verdict{font-size:20px;font-weight:700;margin-bottom:8px}
#verdict.ok{color:var(--ok)}#verdict.ng{color:var(--ng)}
.trans{white-space:pre-line;margin-bottom:8px}
.expl{white-space:pre-line;font-size:14px;color:var(--muted);margin-bottom:10px}
.meanings{width:100%;border-collapse:collapse;font-size:14px}
.meanings td{border-top:1px solid var(--line);padding:5px 4px}
.meanings .say{cursor:pointer;white-space:nowrap}
.meanings tr.correct td{font-weight:700;color:var(--ok)}
.star{border:none;background:none;padding:0 4px;font-size:18px;cursor:pointer;color:var(--muted)}
.star.on{color:#f59e0b}
.list{width:100%;border-collapse:collapse;font-size:14px}
.list td,.list th{border-top:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.hidemean .mean{color:transparent;background:var(--line);border-radius:4px;cursor:pointer}
.form{display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:.9}
.filebtn{border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
#chart svg{width:100%;height:auto}
.lg{display:inline-block;width:12px;height:12px;border-radius:2px;margin:0 4px 0 10px;vertical-align:-1px}
.lg.ok{background:var(--ok)}.lg.ng{background:var(--ng)}.lg.qline{height:2px;background:var(--acc);vertical-align:3px}
#autoBtn.on{border-color:var(--acc);color:var(--acc)}
.streak{font-size:18px;font-weight:700;margin:10px 0 4px}
.lock{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}.lock .card{max-width:360px;width:100%}
</style>
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
</head>
<body>
<header>
  <h1>準1級 語彙ドリル</h1>
  <nav>
    <button data-view="home" class="active">ホーム</button>
    <button data-view="quiz">問題</button>
    <button data-view="wrong">間違い</button>
    <button data-view="words">単語帳</button>
    <button data-view="stats">記録</button>
    <button data-view="settings">設定</button>
  </nav>
</header>

<main>
  <!-- ホーム -->
  <section id="v-home" class="view">
    <div class="card">
      <h2>今日のノルマ</h2>
      <div class="quota"><div class="bar"><div id="quotaFill"></div></div><span id="quotaText"></span></div>
      <p id="streak" class="streak"></p>
      <p id="homeSummary" class="muted"></p>
    </div>
    <div class="card">
      <h2>出題</h2>
      <div class="row">
        <label>種類 <select id="fPos"><option value="">すべて</option></select></label>
        <label>範囲 <input id="fFrom" type="number" min="1" value="1"> 〜 <input id="fTo" type="number" min="1"></label>
      </div>
      <div class="row">
        <label><input type="radio" name="order" value="seq" checked> 番号順</label>
        <label><input type="radio" name="order" value="rand"> ランダム</label>
        <label><input type="checkbox" id="fUnanswered" checked> 未解答を優先</label>
        <button id="autoBtn" title="問題表示時に自動で読み上げる"></button>
      </div>
      <div class="row">
        <button class="primary" id="startBtn">スタート</button>
        <button id="startWrongBtn">間違えた問題を復習</button>
      </div>
    </div>
  </section>

  <!-- 問題 -->
  <section id="v-quiz" class="view hidden">
    <div class="quizhead">
      <span id="qMeta"></span>
      <span class="minibox" title="直近14日の解答数"><span id="miniChart"></span><span id="miniText" class="small muted"></span></span>
      <span id="qProgress" class="muted"></span>
    </div>
    <div class="card">
      <div id="qText" class="qtext"></div>
      <div class="tools">
        <button id="speakBtn" title="もう一度読む (R / *)">🔊 読み上げ</button>
        <span class="muted small">選択: タップ or 1-4 ／ 消去: ✕ or 右クリック or 0→番号 ／ 次へ: Enter</span>
      </div>
      <ol id="choices" class="choices"></ol>
      <div id="elimHint" class="small hidden">消去モード: 番号キーで取り消し線</div>
    </div>
    <div id="answerBox" class="card hidden">
      <div id="verdict"></div>
      <div id="trans" class="trans"></div>
      <div id="expl" class="expl"></div>
      <table id="meanings" class="meanings"></table>

      <div class="row"><button class="primary" id="nextBtn">次へ (Enter)</button><button id="flagBtn" title="間違いストックに入れる/外す">📌 ストック</button><button id="quitBtn">終了</button></div>
    </div>
  </section>

  <!-- 間違い -->
  <section id="v-wrong" class="view hidden">
    <div class="card">
      <h2>間違いストック <span id="wrongCount" class="muted"></span></h2>
      <p class="small muted">復習モードで正解すると自動でストックから外れます。</p>
      <div class="row"><button class="primary" id="startWrongBtn2">復習スタート</button></div>
      <table class="list" id="wrongList"></table>
    </div>
  </section>

  <!-- 単語帳 -->
  <section id="v-words" class="view hidden">
    <div class="card">
      <h2>単語帳 <span id="wordCount" class="muted"></span></h2>
      <div class="row">
        <input id="newWord" placeholder="単語"> <input id="newMean" placeholder="意味（任意）">
        <button id="addWordBtn">追加</button>
        <label><input type="checkbox" id="hideMean"> 意味を隠す</label>
      </div>
      <div class="row">
        <button class="primary" id="wtStartBtn">単語テスト</button>
        <select id="wtMode"><option value="em">英語 → 意味</option><option value="me">意味 → 英語</option></select>
        <span class="small muted">意味が入っている単語から4択で出題</span>
      </div>
      <table class="list" id="wordList"></table>
    </div>
    <div class="card hidden" id="wtBox">
      <div class="quizhead"><b>単語テスト</b><span id="wtProg" class="muted"></span></div>
      <div id="wtQ" class="qtext"></div>
      <ol id="wtChoices" class="choices"></ol>
      <div id="wtRes" class="small"></div>
      <div class="row"><button class="primary hidden" id="wtNext">次へ (Enter)</button><button id="wtQuit">終了</button></div>
    </div>
  </section>

  <!-- 記録 -->
  <section id="v-stats" class="view hidden">
    <div class="card">
      <h2>日別の解答数（直近30日）</h2>
      <div id="chart"></div>
      <p class="small"><span class="lg ok"></span>正解 <span class="lg ng"></span>不正解 <span class="lg qline"></span>ノルマ</p>
    </div>
    <div class="card">
      <h2>種類別の正答率</h2>
      <table class="list" id="posStats"></table>
    </div>
  </section>

  <!-- 設定 -->
  <section id="v-settings" class="view hidden">
    <div class="card">
      <h2>設定</h2>
      <div class="form">
        <label>1日のノルマ（問） <input id="sQuota" type="number" min="1"></label>
        <label><input type="checkbox" id="sAuto"> 問題表示時に自動で読み上げ</label>
        <label>読み上げ速度 <input id="sRate" type="range" min="0.6" max="1.4" step="0.05"> <span id="sRateV"></span></label>
        <label>通常文の声 <select id="sVoiceN"></select></label>
        <label>会話 A の声 <select id="sVoiceA"></select></label>
        <label>会話 B の声 <select id="sVoiceB"></select></label>
        <button id="testVoice">声をテスト</button>
      </div>
    </div>
    <div class="card">
      <h2>データ</h2>
      <div class="row">
        <button id="exportBtn">バックアップを保存</button>
        <label class="filebtn">バックアップを読み込む<input type="file" id="importFile" accept=".json" hidden></label>
        <button id="resetBtn" class="danger">記録をリセット</button>
      </div>
    </div>
  </section>
</main>

<div id="toast" class="toast"></div>

<script>window.QS = [];</script>

<div id="lock" class="lock"><div class="card"><h2>パスワード</h2>
<p class="small muted">ヒント：数字4桁＋富山</p>
<input id="pw" type="password" inputmode="numeric" autocomplete="current-password"> <button class="primary" id="pwBtn">開く</button>
<p id="pwMsg" class="small muted"></p></div></div>
<script type="text/plain" id="appsrc">'use strict';
const $ = s => document.querySelector(s);
const KEY = 'eikenP1VocabV1';
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

// ---------- データ ----------
const POS = ['動詞', '名詞', '形容詞・副詞', '熟語', '模試1', '模試2', '模試3', '模試4', '模試5'];
// n: 内部ID（品詞ごとに1000単位）, no: 本の問題番号
const Q = QS.map(r => ({ n: (POS.indexOf(r[1]) + 1) * 1000 + r[0], no: r[0], pos: r[1], q: r[2], c: r[3], a: r[4], m: r[5], t: r[6], e: r[7] })).sort((x, y) => x.n - y.n);
const label = q => `${q.pos} ${String(q.no).padStart(3, '0')}`;
const byN = Object.fromEntries(Q.map(q => [q.n, q]));

const DEF = { hist: {}, wrong: {}, words: [], log: {}, settings: { quota: 20, auto: true, rate: 0.95, vN: '', vA: '', vB: '' } };
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { S = {}; }
S = Object.assign(structuredClone(DEF), S);
S.settings = Object.assign(structuredClone(DEF.settings), S.settings);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('保存に失敗しました'); } };

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1600); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------- 画面切替 ----------
let view = 'home';
function show(v) {
  view = v;
  document.querySelectorAll('.view').forEach(e => e.classList.add('hidden'));
  $('#v-' + v).classList.remove('hidden');
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  if (v !== 'quiz') speechSynthesis.cancel();
  if (v !== 'words' && wt) wtQuit();
  ({ home: renderHome, wrong: renderWrong, words: renderWords, stats: renderStats, settings: renderSettings, quiz: () => { if (!sess) startSession(false); } })[v]();
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.view));

// ---------- ホーム ----------
const posList = [...new Set(Q.map(q => q.pos))];
posList.forEach(p => $('#fPos').insertAdjacentHTML('beforeend', `<option>${p}</option>`));
$('#fTo').value = Math.max(...Q.map(q => q.no));

function renderHome() {
  const l = S.log[today()] || { ok: 0, ng: 0 }, done = l.ok + l.ng, quota = S.settings.quota;
  $('#quotaFill').style.width = Math.min(100, done / quota * 100) + '%';
  $('#quotaText').textContent = `${done} / ${quota} 問` + (done >= quota ? ' 達成！' : '');
  const answered = Q.filter(q => S.hist[q.n]).length;
  const st = streak();
  $('#streak').textContent = st.cur ? `🔥 ${st.cur}日連続ノルマ達成` + (st.best > st.cur ? `（最高 ${st.best}日）` : '') + (done < quota ? ' ─ 今日も達成で更新！' : '') : (st.best ? `連続記録は途切れています（最高 ${st.best}日）。今日から再スタート！` : 'ノルマを達成すると連続日数が記録されます');
  $('#homeSummary').textContent = `全${Q.length}問中 ${answered}問 解答済み ／ 間違いストック ${Object.keys(S.wrong).length}問 ／ 単語帳 ${S.words.length}語` + (done ? ` ／ 今日の正答率 ${Math.round(l.ok / done * 100)}%` : '');
}

// 連続ノルマ達成日数（今日が未達成なら昨日までで数える）
function dkey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function streak() {
  const met = k => { const l = S.log[k]; return l && l.ok + l.ng >= S.settings.quota; };
  const d = new Date(); if (!met(dkey(d))) d.setDate(d.getDate() - 1);
  let cur = 0; while (met(dkey(d))) { cur++; d.setDate(d.getDate() - 1); }
  let best = 0, run = 0, prev = null;
  Object.keys(S.log).sort().filter(met).forEach(k => {
    const t = new Date(k + 'T00:00:00'); run = prev && (t - prev) / 864e5 === 1 ? run + 1 : 1; prev = t; best = Math.max(best, run);
  });
  return { cur, best: Math.max(best, cur) };
}

// ---------- 出題 ----------
let sess = null; // {list, i, review}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function startSession(review) {
  let list;
  if (review) {
    list = shuffle(Object.keys(S.wrong).map(Number).filter(n => byN[n]));
    if (!list.length) { toast('間違いストックは空です'); show('home'); return; }
  } else {
    const pos = $('#fPos').value, from = +$('#fFrom').value || 1, to = +$('#fTo').value || 9999;
    list = Q.filter(q => (!pos || q.pos === pos) && q.no >= from && q.no <= to).map(q => q.n);
    const rand = document.querySelector('input[name=order]:checked').value === 'rand';
    if (rand) shuffle(list);
    if ($('#fUnanswered').checked) {
      const un = list.filter(n => !S.hist[n]);
      if (un.length) list = un.concat(list.filter(n => S.hist[n]));
    }
    if (!list.length) { toast('該当する問題がありません'); show('home'); return; }
  }
  sess = { list, i: 0, review, ok: 0 };
  show('quiz');
  renderQuestion();
}
$('#startBtn').onclick = () => startSession(false);
$('#startWrongBtn').onclick = $('#startWrongBtn2').onclick = () => startSession(true);

let cur = null, answered = false, elimMode = false, elims = new Set();

function lines(q) { // 会話文なら [{spk, text}]
  return q.split('\n').map(s => { const m = s.match(/^([AB]):\s*(.*)$/); return m ? { spk: m[1], text: m[2] } : { spk: '', text: s }; });
}
function wrapWords(text, fill) {
  return text.split(/(\(\s*\))/).map(part => {
    if (/^\(\s*\)$/.test(part)) return `<span class="blank${fill ? ' filled' : ''}">${fill ? esc(fill) : '&nbsp;'}</span>`;
    return part.split(/([A-Za-z][A-Za-z'’\-]*)/).map((w, i) => i % 2 ? `<span class="w">${esc(w)}</span>` : esc(w)).join('');
  }).join('');
}
function renderText(fill) {
  $('#qText').innerHTML = lines(cur.q).map(l => `<div class="line">${l.spk ? `<span class="spk">${l.spk}:</span>` : ''}<span>${wrapWords(l.text, fill)}</span></div>`).join('');
}

function renderQuestion() {
  cur = byN[sess.list[sess.i]];
  answered = false; elimMode = false; elims = new Set();
  $('#v-quiz').classList.remove('answered', 'elimmode');
  $('#elimHint').classList.add('hidden');
  $('#answerBox').classList.add('hidden');
  const h = S.hist[cur.n] || [];
  $('#qMeta').innerHTML = `<b>${label(cur)}</b>` + (sess.review ? '　<span class="muted">復習</span>' : '') + (h.length ? `　<span class="muted small">過去 ${h.filter(x => x.ok).length}/${h.length} 正解</span>` : '');
  $('#qProgress').textContent = `${sess.i + 1} / ${sess.list.length}`;
  renderMini();
  renderText();
  $('#choices').innerHTML = cur.c.map((c, i) => `<li data-i="${i + 1}"><span class="n">${i + 1}</span><span class="t">${esc(c)}</span><button class="x" title="消去（取り消し線）">✕</button></li>`).join('');
  $('#choices').querySelectorAll('li').forEach(li => {
    li.querySelector('.x').onclick = e => { e.stopPropagation(); toggleElim(+li.dataset.i); };
    li.onclick = () => answered ? null : answer(+li.dataset.i);
    li.oncontextmenu = e => { e.preventDefault(); toggleElim(+li.dataset.i); };
  });
  updateFlag();
  if (S.settings.auto) speak();
}

function toggleElim(i) {
  if (answered) return;
  elims.has(i) ? elims.delete(i) : elims.add(i);
  $(`#choices li[data-i="${i}"]`).classList.toggle('elim', elims.has(i));
}
function setElimMode(on) {
  elimMode = on;
  $('#v-quiz').classList.toggle('elimmode', on);
  $('#elimHint').classList.toggle('hidden', !on);
}

function answer(i) {
  answered = true; setElimMode(false);
  const ok = i === cur.a, d = today();
  (S.hist[cur.n] = S.hist[cur.n] || []).push({ d, ok, pick: i });
  const l = S.log[d] = S.log[d] || { ok: 0, ng: 0 };
  ok ? l.ok++ : l.ng++;
  if (ok) sess.ok++;
  if (!ok) S.wrong[cur.n] = true;
  else if (sess.review) delete S.wrong[cur.n];
  save();

  $('#v-quiz').classList.add('answered');
  $('#choices').querySelectorAll('li').forEach(li => {
    const k = +li.dataset.i;
    if (k === cur.a) li.classList.add('correct');
    else if (k === i) li.classList.add('wrongpick');
  });
  renderText(cur.c[cur.a - 1]);
  $('#qText').querySelectorAll('.w').forEach(w => w.onclick = () => addWord(w.textContent, '', cur.n));
  const v = $('#verdict');
  v.className = ok ? 'ok' : 'ng';
  v.textContent = (ok ? '○ 正解！' : '× 不正解') + `　正解: ${cur.a} ${cur.c[cur.a - 1]}` + (ok && sess.review ? '（ストックから外しました）' : '');
  $('#trans').textContent = cur.t || '';
  $('#expl').textContent = cur.e || '';
  $('#meanings').innerHTML = cur.c.map((c, k) => `<tr class="${k + 1 === cur.a ? 'correct' : ''}"><td>${k + 1}</td><td><button class="star${hasWord(c) ? ' on' : ''}" data-k="${k}" title="単語帳に追加">★</button></td><td class="say" data-k="${k}" title="クリックで発音">🔊 ${esc(c)}</td><td>${esc(cur.m[k] || '')}</td></tr>`).join('');
  $('#meanings').querySelectorAll('.say').forEach(td => td.onclick = () => { speechSynthesis.cancel(); utter(cur.c[+td.dataset.k], S.settings.vN); });
  $('#meanings').querySelectorAll('.star').forEach(b => b.onclick = () => { const k = +b.dataset.k; toggleWord(cur.c[k], cur.m[k], cur.n); b.classList.toggle('on', hasWord(cur.c[k])); });
  $('#answerBox').classList.remove('hidden');
  updateFlag();
  renderQuotaToast();
  renderMini();
  // 選んだ単語を発音（不正解なら続けて正解の単語も）
  speechSynthesis.cancel();
  clearTimeout(speakTimer);
  const word = () => { utter(cur.c[i - 1], S.settings.vN); if (!ok) utter(cur.c[cur.a - 1], S.settings.vN); };
  if (ok) { pinpon(); speakTimer = setTimeout(word, 700); } else word();
}

// 正解の効果音「ピンポン」（高い音→低い音）をその場で合成する
let actx = null;
function pinpon() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    actx.resume();
    const t0 = actx.currentTime;
    [[1318.5, 0], [1046.5, 0.22]].forEach(([f, dt]) => { // E6 → C6
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + dt);
      g.gain.exponentialRampToValueAtTime(0.35, t0 + dt + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + 0.45);
      o.connect(g).connect(actx.destination);
      o.start(t0 + dt); o.stop(t0 + dt + 0.5);
    });
  } catch (e) { }
}
function renderQuotaToast() {
  const l = S.log[today()], done = l.ok + l.ng;
  if (done === S.settings.quota) toast(`🎉 今日のノルマ ${done}問 達成！`);
}

function next() {
  speechSynthesis.cancel(); clearTimeout(speakTimer);
  if (sess.i + 1 >= sess.list.length) { toast(`このセットは終了です（${sess.ok} / ${sess.list.length} 正解）`); sess = null; show('home'); return; }
  sess.i++; renderQuestion();
}
$('#nextBtn').onclick = next;
$('#quitBtn').onclick = () => { sess = null; show('home'); };
$('#speakBtn').onclick = () => speak();
function updateFlag() { $('#flagBtn').textContent = S.wrong[cur.n] ? '📌 ストック中' : '📌 ストック'; }
$('#flagBtn').onclick = () => { S.wrong[cur.n] ? delete S.wrong[cur.n] : (S.wrong[cur.n] = true); save(); updateFlag(); toast(S.wrong[cur.n] ? '間違いストックに追加' : 'ストックから外しました'); };

document.addEventListener('keydown', e => {
  if (view !== 'quiz' || !cur || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  const k = e.key;
  if (k === 'Enter') { e.preventDefault(); if (answered) next(); return; }
  if (k === '*' || k === 'r' || k === 'R') { speak(); return; }
  if (answered) return;
  if (k === '0' || k === '.' || k === 'Decimal') { setElimMode(!elimMode); return; }
  if (/^[1-4]$/.test(k)) {
    const i = +k;
    if (elimMode) { toggleElim(i); setElimMode(false); }
    else answer(i);
  }
});

// ---------- 読み上げ ----------
let voices = [];
const MALE = /david|mark|aaron|arthur|gordon|rishi|guy|andrew|brian|christopher|eric|roger|steffan|ryan|daniel|thomas|george|james|william|liam|alex|fred|tom|male/i;
const FEMALE = /zira|aria|jenny|michelle|ava|emma|samantha|susan|hazel|libby|sonia|karen|natasha|clara|ana|female|catherine|moira|tessa|nicky|kate|serena/i;
function loadVoices() {
  voices = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
  const st = S.settings;
  const pick = re => (voices.find(v => re.test(v.name) && /en-US/i.test(v.lang)) || voices.find(v => re.test(v.name)) || voices[0] || {}).name || '';
  if (!st.vA) st.vA = pick(MALE);
  if (!st.vB) st.vB = pick(FEMALE);
  if (!st.vN) st.vN = pick(FEMALE);
  if (view === 'settings') renderSettings();
}
speechSynthesis.onvoiceschanged = loadVoices; loadVoices();
const voiceBy = name => voices.find(v => v.name === name) || null;

function utter(text, vname) {
  const u = new SpeechSynthesisUtterance(text);
  const v = voiceBy(vname); if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
  u.rate = +S.settings.rate;
  speechSynthesis.speak(u);
}
// iPad(Safari)は最初の読み上げをタップ操作の中で行わないと音が出ないので、最初の操作で無音の発話をして解除しておく
function unlockSpeech() {
  speechSynthesis.speak(new SpeechSynthesisUtterance(''));
  document.removeEventListener('pointerdown', unlockSpeech, true);
  document.removeEventListener('keydown', unlockSpeech, true);
}
document.addEventListener('pointerdown', unlockSpeech, true);
document.addEventListener('keydown', unlockSpeech, true);

let speakTimer = null;
function speak() {
  if (!cur) return;
  speechSynthesis.cancel();
  clearTimeout(speakTimer);
  const q = cur;
  // cancel直後にspeakすると無視されるブラウザがあるので少し待つ
  speakTimer = setTimeout(() => {
    if (cur !== q) return;
    speechSynthesis.resume();
    const st = S.settings, fill = answered ? cur.c[cur.a - 1] : null;
    lines(cur.q).forEach(l => {
      const v = l.spk === 'A' ? st.vA : l.spk === 'B' ? st.vB : st.vN;
      // 解答前は空欄の前後で発話を分けて、空欄を一瞬の間にする
      const parts = fill ? [l.text.replace(/\(\s*\)/g, fill)] : l.text.split(/\(\s*\)/);
      parts.map(p => p.trim()).filter(p => p).forEach(p => utter(p, v));
    });
  }, 150);
}
function updateAutoBtn() { $('#autoBtn').textContent = S.settings.auto ? '自動読み上げ ON' : '自動読み上げ OFF'; $('#autoBtn').classList.toggle('on', S.settings.auto); }
$('#autoBtn').onclick = () => { S.settings.auto = !S.settings.auto; save(); updateAutoBtn(); };
updateAutoBtn();

// ---------- 間違い ----------
function renderWrong() {
  const ns = Object.keys(S.wrong).map(Number).filter(n => byN[n]).sort((a, b) => a - b);
  $('#wrongCount').textContent = `${ns.length}問`;
  $('#wrongList').innerHTML = ns.map(n => { const q = byN[n], h = S.hist[n] || []; return `<tr><td>${label(q)}</td><td>${esc(q.q.replace(/\n/g, ' '))}<br><span class="small muted">正解: ${esc(q.c[q.a - 1])}（${h.filter(x => x.ok).length}/${h.length}）</span></td><td><button data-n="${n}" class="rm">外す</button></td></tr>`; }).join('') || '<tr><td class="muted">まだありません</td></tr>';
  $('#wrongList').querySelectorAll('.rm').forEach(b => b.onclick = () => { delete S.wrong[b.dataset.n]; save(); renderWrong(); });
}

// ---------- 単語帳 ----------
const norm = w => w.toLowerCase().trim();
const hasWord = w => S.words.some(x => norm(x.w) === norm(w));
function findMeaning(w) { for (const q of Q) { const k = q.c.findIndex(c => norm(c) === norm(w)); if (k >= 0) return q.m[k]; } return ''; }
function addWord(w, m, n) {
  if (hasWord(w)) { toast(`「${w}」は登録済み`); return; }
  S.words.unshift({ w, m: m || findMeaning(w), n: n || null, d: today() }); save(); toast(`「${w}」を単語帳に追加`);
}
function toggleWord(w, m, n) {
  if (hasWord(w)) { S.words = S.words.filter(x => norm(x.w) !== norm(w)); save(); toast(`「${w}」を単語帳から削除`); }
  else addWord(w, m, n);
}
function renderWords() {
  $('#wordCount').textContent = `${S.words.length}語`;
  $('#wordList').classList.toggle('hidemean', $('#hideMean').checked);
  $('#wordList').innerHTML = S.words.map((x, i) => `<tr><td><button class="star on" data-i="${i}" data-a="say">🔊</button></td><td><b>${esc(x.w)}</b></td><td class="mean" data-i="${i}">${esc(x.m || '（クリックで意味を入力）')}</td><td class="small muted">${x.n && byN[x.n] ? label(byN[x.n]) : ''}</td><td><button data-i="${i}" data-a="del">削除</button></td></tr>`).join('') || '<tr><td class="muted">まだありません。解答後に★や問題文の単語をクリックで追加できます。</td></tr>';
  $('#wordList').querySelectorAll('button').forEach(b => b.onclick = () => {
    const x = S.words[b.dataset.i];
    if (b.dataset.a === 'say') { speechSynthesis.cancel(); utter(x.w, S.settings.vN); }
    else { S.words.splice(b.dataset.i, 1); save(); renderWords(); }
  });
  $('#wordList').querySelectorAll('.mean').forEach(td => td.onclick = () => {
    if ($('#hideMean').checked && !td.dataset.shown) { td.dataset.shown = 1; td.style.color = 'inherit'; td.style.background = 'none'; return; }
    const x = S.words[td.dataset.i], m = prompt(`「${x.w}」の意味`, x.m || '');
    if (m !== null) { x.m = m; save(); renderWords(); }
  });
}
$('#addWordBtn').onclick = () => { const w = $('#newWord').value.trim(); if (!w) return; addWord(w, $('#newMean').value.trim()); $('#newWord').value = $('#newMean').value = ''; renderWords(); };
$('#hideMean').onchange = renderWords;

// ---------- 単語テスト ----------
let wt = null; // {list, i, ok, mode, done}
const allMeanings = () => [...new Set(Q.flatMap(q => q.m))];
const allWords = () => [...new Set(Q.flatMap(q => q.c))];
$('#wtStartBtn').onclick = () => {
  const list = shuffle(S.words.filter(x => x.m && x.m.trim()));
  if (!list.length) { toast('意味が入っている単語がありません'); return; }
  wt = { list, i: 0, ok: 0, mode: $('#wtMode').value };
  $('#wtBox').classList.remove('hidden'); $('#wtBox').scrollIntoView({ behavior: 'smooth' });
  wtShow();
};
function wtShow() {
  const x = wt.list[wt.i], em = wt.mode === 'em';
  const right = em ? x.m : x.w;
  const others = em ? [...S.words.map(y => y.m).filter(Boolean), ...allMeanings()] : [...S.words.map(y => y.w), ...allWords()];
  const pool = shuffle([...new Set(others.filter(o => o && norm(o) !== norm(right)))]).slice(0, 3);
  wt.choices = shuffle([right, ...pool]); wt.ans = wt.choices.indexOf(right) + 1; wt.done = false;
  $('#wtProg').textContent = `${wt.i + 1} / ${wt.list.length}　正解 ${wt.ok}`;
  $('#wtQ').textContent = em ? x.w : x.m;
  $('#wtChoices').innerHTML = wt.choices.map((c, i) => `<li data-i="${i + 1}"><span class="n">${i + 1}</span><span class="t">${esc(c)}</span></li>`).join('');
  $('#wtChoices').querySelectorAll('li').forEach(li => li.onclick = () => wtAnswer(+li.dataset.i));
  $('#wtRes').textContent = ''; $('#wtNext').classList.add('hidden');
  if (em) { speechSynthesis.cancel(); utter(x.w, S.settings.vN); }
}
function wtAnswer(i) {
  if (wt.done) return; wt.done = true;
  const ok = i === wt.ans, x = wt.list[wt.i];
  if (ok) { wt.ok++; pinpon(); }
  $('#wtChoices').querySelectorAll('li').forEach(li => { const k = +li.dataset.i; if (k === wt.ans) li.classList.add('correct'); else if (k === i) li.classList.add('wrongpick'); });
  $('#wtRes').textContent = (ok ? '○ 正解　' : '× 不正解　') + `${x.w}：${x.m}`;
  $('#wtProg').textContent = `${wt.i + 1} / ${wt.list.length}　正解 ${wt.ok}`;
  if (wt.mode === 'me') { speechSynthesis.cancel(); setTimeout(() => utter(x.w, S.settings.vN), ok ? 700 : 0); }
  $('#wtNext').classList.remove('hidden');
}
function wtNext() {
  if (wt.i + 1 >= wt.list.length) { toast(`単語テスト終了（${wt.ok} / ${wt.list.length} 正解）`); wtQuit(); return; }
  wt.i++; wtShow();
}
function wtQuit() { wt = null; $('#wtBox').classList.add('hidden'); speechSynthesis.cancel(); }
$('#wtNext').onclick = wtNext; $('#wtQuit').onclick = wtQuit;
document.addEventListener('keydown', e => {
  if (view !== 'words' || !wt || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.key === 'Enter') { e.preventDefault(); if (wt.done) wtNext(); }
  else if (/^[1-4]$/.test(e.key)) wtAnswer(+e.key);
});

// ---------- 記録 ----------
function lastDays(n) {
  const days = [];
  for (let i = n - 1; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); const k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); days.push([k, S.log[k] || { ok: 0, ng: 0 }]); }
  return days;
}
function chartSVG(days, mini) {
  const quota = S.settings.quota, max = Math.max(quota, ...days.map(([, l]) => l.ok + l.ng)) * 1.1;
  const W = mini ? 300 : 760, H = mini ? 60 : 260, L = mini ? 0 : 34, B = mini ? 4 : 30, bw = (W - L) / days.length, y = v => H - B - v / max * (H - B - (mini ? 2 : 10));
  let svg = `<svg viewBox="0 0 ${W} ${H}" font-size="11" fill="currentColor">`;
  if (!mini) for (let t = 0; t <= 4; t++) { const v = Math.round(max / 1.1 * t / 4); svg += `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 4}" y="${y(v) + 4}" text-anchor="end" fill="var(--muted)">${v}</text>`; }
  days.forEach(([k, l], i) => {
    const x = L + i * bw + (mini ? 1 : 2), w = bw - (mini ? 2 : 4);
    svg += `<g><title>${k}: ${l.ok + l.ng}問（正解${l.ok}）</title><rect x="${x}" y="${y(l.ok)}" width="${w}" height="${y(0) - y(l.ok)}" fill="var(--ok)"/><rect x="${x}" y="${y(l.ok + l.ng)}" width="${w}" height="${y(l.ok) - y(l.ok + l.ng)}" fill="var(--ng)"/></g>`;
    if (!mini && (i % 5 === 4 || i === days.length - 1)) svg += `<text x="${x + w / 2}" y="${H - 10}" text-anchor="middle" fill="var(--muted)">${+k.slice(5, 7)}/${+k.slice(8)}</text>`;
  });
  svg += `<line x1="${L}" x2="${W}" y1="${y(quota)}" y2="${y(quota)}" stroke="var(--acc)" stroke-width="${mini ? 1.5 : 2}" stroke-dasharray="6 4"/>`;
  if (mini) svg += `<line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>`;
  return svg + '</svg>';
}
function renderMini() {
  const l = S.log[today()] || { ok: 0, ng: 0 };
  $('#miniChart').innerHTML = chartSVG(lastDays(14), true);
  $('#miniText').textContent = `今日 ${l.ok + l.ng} / ${S.settings.quota}`;
}
function renderStats() {
  const days = lastDays(30), quota = S.settings.quota;
  const svg = chartSVG(days, false);
  const total = Object.values(S.log).reduce((a, l) => a + l.ok + l.ng, 0), achieved = Object.values(S.log).filter(l => l.ok + l.ng >= quota).length;
  $('#chart').innerHTML = svg + `<p class="small muted">累計 ${total}問 ／ ノルマ達成 ${achieved}日</p>`;
  $('#posStats').innerHTML = '<tr><th>種類</th><th>問題数</th><th>解答済み</th><th>正答率(のべ)</th></tr>' + posList.map(p => {
    const qs = Q.filter(q => q.pos === p), hs = qs.flatMap(q => S.hist[q.n] || []);
    return `<tr><td>${p}</td><td>${qs.length}</td><td>${qs.filter(q => S.hist[q.n]).length}</td><td>${hs.length ? Math.round(hs.filter(h => h.ok).length / hs.length * 100) + '%' : '-'}</td></tr>`;
  }).join('');
}

// ---------- 設定 ----------
function renderSettings() {
  const st = S.settings;
  $('#sQuota').value = st.quota; $('#sAuto').checked = st.auto; $('#sRate').value = st.rate; $('#sRateV').textContent = st.rate;
  ['N', 'A', 'B'].forEach(k => { $('#sVoice' + k).innerHTML = voices.map(v => `<option${v.name === st['v' + k] ? ' selected' : ''}>${esc(v.name)}</option>`).join(''); });
}
$('#sQuota').onchange = e => { S.settings.quota = Math.max(1, +e.target.value || 20); save(); };
$('#sAuto').onchange = e => { S.settings.auto = e.target.checked; save(); };
$('#sRate').oninput = e => { S.settings.rate = +e.target.value; $('#sRateV').textContent = e.target.value; save(); };
['N', 'A', 'B'].forEach(k => $('#sVoice' + k).onchange = e => { S.settings['v' + k] = e.target.value; save(); });
$('#testVoice').onclick = () => { speechSynthesis.cancel(); utter('This is the normal voice.', S.settings.vN); utter('Hi, I am speaker A.', S.settings.vA); utter('And I am speaker B.', S.settings.vB); };
$('#exportBtn').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }));
  a.download = `eiken-p1-backup-${today()}.json`; a.click();
};
$('#importFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => { const d = JSON.parse(t); S = Object.assign(structuredClone(DEF), d); S.settings = Object.assign(structuredClone(DEF.settings), d.settings); save(); toast('読み込みました'); show('home'); }).catch(() => toast('読み込みに失敗しました'));
};
$('#resetBtn').onclick = () => { if (confirm('解答記録・間違いストック・単語帳をすべて消します。よろしいですか？')) { const st = S.settings; S = structuredClone(DEF); S.settings = st; save(); show('home'); } };

show('home');

const ub = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: ub(ENC.salt), iterations: ENC.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const js = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub(ENC.iv) }, key, ub(ENC.data)));
  for (const src of [js, document.getElementById('appsrc').textContent]) { const s = document.createElement('script'); s.textContent = src; document.body.appendChild(s); }
  document.getElementById('lock').remove();
}
async function tryPw(pw, remember) {
  try { await unlock(pw); if (remember) try { localStorage.setItem('eikenPw', pw); } catch (e) {} return true; }
  catch (e) { return false; }
}
(async () => {
  let saved = null; try { saved = localStorage.getItem('eikenPw'); } catch (e) {}
  if (saved && await tryPw(saved, false)) return;
  const go = async () => { document.getElementById('pwMsg').textContent = '確認中…'; if (!await tryPw(document.getElementById('pw').value, true)) document.getElementById('pwMsg').textContent = 'パスワードが違います'; };
  document.getElementById('pwBtn').onclick = go;
  document.getElementById('pw').onkeydown = e => { if (e.key === 'Enter') go(); };
})();
